<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Dodge</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#060714;color:white;font:14px system-ui;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 8px black}.tip{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#c8c7eb;pointer-events:none}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050716bd}.overlay[hidden]{display:none}.box{text-align:center;background:#11152d;border:1px solid #7777c9;border-radius:20px;padding:30px;max-width:90%}button{background:#9588ff;color:#0b0a20;border:0;border-radius:12px;padding:13px 25px;font-weight:700;cursor:pointer}</style></head><body><canvas id="c"></canvas><div class="hud"><span>STAR DODGE</span><span id="score">Score: 0</span></div><div class="tip">Move with ← → or A / D · Touch and drag on mobile</div><div class="overlay" id="overlay"><div class="box"><h1 id="title">STAR DODGE</h1><p id="message">Dodge falling meteors. How long can you survive?</p><button id="play">Play</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),ov=document.getElementById('overlay');let W=0,H=0,player=0,keys={},meteors=[],stars=[],score=0,running=false,prev=0,spawn=0,raf=0;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;player=Math.max(25,Math.min(W-25,player||W/2));stars=Array.from({length:90},()=>[Math.random()*W,Math.random()*H,Math.random()*2+.3]);}addEventListener('resize',resize);resize();
function draw(){ctx.fillStyle='#07091c';ctx.fillRect(0,0,W,H);for(const [x,y,r] of stars){ctx.fillStyle='#a9b8ff99';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}ctx.fillStyle='#91e8ff';ctx.shadowColor='#91e8ff';ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(player,H-83);ctx.lineTo(player-22,H-35);ctx.lineTo(player+22,H-35);ctx.closePath();ctx.fill();ctx.shadowBlur=0;for(const m of meteors){ctx.fillStyle='#ff7899';ctx.shadowColor='#ff4978';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill();ctx.shadowBlur=0;}}
function tick(now){if(!running)return;const dt=Math.min(.04,(now-prev)/1000||.016);prev=now;score+=dt*10;document.getElementById('score').textContent='Score: '+Math.floor(score);if(keys.ArrowLeft||keys.a)player-=300*dt;if(keys.ArrowRight||keys.d)player+=300*dt;player=Math.max(24,Math.min(W-24,player));spawn-=dt;if(spawn<=0){meteors.push({x:15+Math.random()*(W-30),y:-20,r:10+Math.random()*13,speed:140+score*1.5});spawn=Math.max(.16,.7-score/500);}for(const m of meteors){m.y+=m.speed*dt;if(Math.abs(m.x-player)<m.r+16&&Math.abs(m.y-(H-58))<m.r+22){running=false;document.getElementById('title').textContent='GAME OVER';document.getElementById('message').textContent='Score: '+Math.floor(score);document.getElementById('play').textContent='Play again';ov.hidden=false;}}meteors=meteors.filter(m=>m.y<H+40);draw();if(running)raf=requestAnimationFrame(tick);}
document.getElementById('play').onclick=()=>{cancelAnimationFrame(raf);meteors=[];score=0;spawn=.4;prev=performance.now();running=true;ov.hidden=true;raf=requestAnimationFrame(tick)};document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){e.preventDefault();keys[e.key]=true;}});document.addEventListener('keyup',e=>{keys[e.key]=false;});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')player=e.clientX;});c.addEventListener('pointerdown',e=>{player=e.clientX;});draw();
</script></body></html>
